      color: #111;

    .floating-edge-link:hover {
      background: var(--accent-hover);

  <script>
    let pendingTimeouts = [];
    let currentActiveLauncher = null;

    const launchAllButton = document.getElementById('launchAllBtn');
    const stopLaunchingButton = document.getElementById('stopLaunchingBtn');
    const creatorsListButton = document.getElementById('creatorsListBtn');
    const toggleAllButton = document.getElementById('toggleAllBtn');
    const infoMessageElement = document.getElementById('infoMessage');
    const container = document.getElementById('categories');
    const progressBadge = document.getElementById('progressBadge');

    function showInfoMessage(msg, duration = 3000) {
      infoMessageElement.textContent = msg;
      infoMessageElement.style.display = 'block';
      setTimeout(() => infoMessageElement.style.display = 'none', duration);
    }

    // Filter local page tags as user types
    function handleSearchInput(val) {
      const query = val.toLowerCase().trim();
      const links = document.querySelectorAll('.link-item');

      links.forEach(link => {
        if (query && link.textContent.toLowerCase().includes(query)) {
          link.classList.add('highlight');
        } else {
          link.classList.remove('highlight');
        }
      });
    }

    function searchAmazonKey(e) {
      if (e.key === 'Enter') searchAmazonClick();
    }

    function searchAmazonClick() {
      const term = document.getElementById('searchBox').value.trim();
      if (!term) return showInfoMessage("Please enter a search term.", 2000);
      const encoded = encodeURIComponent(term);
      window.open(`https://www.amazon.com/vine/vine-items?search=${encoded}`, '_blank');
      showInfoMessage(`Searching Amazon Vine for "${term}"...`);
    }

    function getDelayValue() {
      const v = document.getElementById('delay').value;
      if (v === 'random') return Math.floor(Math.random() * (10000 - 4000 + 1)) + 4000;
      return parseInt(v, 10);
    }

    // Core Tab Launcher with Visual Counter
    function launchItems(items, prefix, elem, fixedDelay = null) {
      if (currentActiveLauncher && currentActiveLauncher !== elem) {
        return showInfoMessage('Another launch sequence is active. Please stop it first.', 4000);
      }

      stopLaunching();
      currentActiveLauncher = elem;
      stopLaunchingButton.disabled = false;
      launchAllButton.disabled = true;
      creatorsListButton.disabled = true;

      showInfoMessage(`${prefix}...`);
      progressBadge.style.display = 'inline-flex';

      let total = items.length;
      let done = 0;
      let delaySum = 0;

      if (total === 0) {
        resetLaunchButtons();
        return showInfoMessage('No items to launch.', 2000);
      }

      progressBadge.textContent = `Launching 0 / ${total}`;

      items.forEach(([_, slug], index) => {
        const url = `https://www.amazon.com/vine/vine-items?search=${slug}`;
        const d = fixedDelay !== null ? fixedDelay : getDelayValue();

        const id = setTimeout(() => {
          const win = window.open(url, '_blank');
          if (!win) {
            showInfoMessage('Popup blocked! Please allow popups for this site.', 5000);
          }
          done++;
          progressBadge.textContent = `Launching ${done} / ${total}`;

          pendingTimeouts = pendingTimeouts.filter(x => x !== id);

          if (done === total) {
            setTimeout(() => {
              if (pendingTimeouts.length === 0) {
                resetLaunchButtons();
                showInfoMessage('All tabs launched!', 3000);
              }
            }, 500);
          }
        }, delaySum);

        pendingTimeouts.push(id);
        delaySum += d;
      });
    }

    function resetLaunchButtons() {
      pendingTimeouts.forEach(clearTimeout);
      pendingTimeouts = [];
      launchAllButton.disabled = false;
      creatorsListButton.disabled = false;
      stopLaunchingButton.disabled = true;
      progressBadge.style.display = 'none';
      currentActiveLauncher = null;
    }

    function stopLaunching() {
      if (pendingTimeouts.length) showInfoMessage('Tab launching stopped!', 2000);
      resetLaunchButtons();

      ["IP68","IP68"],["Wireless","Wireless"],["Google Pixel 10 XL","Google%20Pixel%2010%20XL"],

    // Render Categories & Actions
    Object.entries(categories).forEach(([title, items]) => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category expanded';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'category-header';

      const h3 = document.createElement('h3');
      h3.innerHTML = `<span class="arrow">▶</span> ${title}`;

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'category-actions';

      const launchBtn = document.createElement('button');
      launchBtn.className = 'cat-launch-btn';
      launchBtn.textContent = `🚀 Launch (${items.length})`;
      launchBtn.onclick = (e) => {
        e.stopPropagation();
        launchItems(items, `Launching ${title}`, launchBtn);
      };

      actionsDiv.appendChild(launchBtn);
      headerDiv.appendChild(h3);
      headerDiv.appendChild(actionsDiv);

      headerDiv.onclick = () => {
        catDiv.classList.toggle('expanded');
      };

      catDiv.appendChild(headerDiv);

      const linksDiv = document.createElement('div');
      linksDiv.className = 'links';

      items.forEach(([lbl, slug]) => {
        const a = document.createElement('a');
        a.href = `https://www.amazon.com/vine/vine-items?search=${slug}`;
        a.target = '_blank';
        a.className = 'link-item';
        a.textContent = lbl;
        linksDiv.appendChild(a);
      });

      catDiv.appendChild(linksDiv);
      container.appendChild(catDiv);
    });
  </script>
</body>
